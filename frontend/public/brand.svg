<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" role="img" aria-labelledby="title desc">
<title id="title">CuratoCV Wordmark</title>
<desc id="desc">CuratoCV wordmark with Curato and CV directly adjacent.</desc>

<defs>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#58AFAF"/>
    <stop offset="100%" stop-color="#72C2C2"/>
  </linearGradient>
</defs>

<text x="30" y="150"
      font-family="Inter, Avenir Next, Segoe UI, Arial, sans-serif"
      font-size="142"
      font-weight="700"
      letter-spacing="-6"
      fill="#17375F">Curato</text>

<text x="461" y="150"
      font-family="Inter, Avenir Next, Segoe UI, Arial, sans-serif"
      font-size="142"
      font-weight="700"
      letter-spacing="-6"
      fill="url(#accent)">CV</text>
</svg>